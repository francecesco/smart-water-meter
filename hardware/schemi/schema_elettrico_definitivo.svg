<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
 text{font-family:Arial,Helvetica,sans-serif;}
 .t{font-size:16px;font-weight:700;fill:#1f2933;}
 .h{font-size:13px;font-weight:700;fill:#1f2933;}
 .s{font-size:11px;fill:#5b6570;}
 .p{font-size:11px;fill:#2b333b;}
 .v{font-size:11px;font-weight:700;fill:#2b333b;}
 .pw{stroke:#d1493f;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
 .gn{stroke:#2b333b;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
 .sg{stroke:#6b7580;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
 .bus{stroke-width:3.5;}
</style>
<rect width="1240" height="740" fill="#ffffff"/>
<text class="t" x="20" y="32">Contatore acqua — schema elettrico definitivo (v1)</text>

<!-- BUS -->
<line class="pw bus" x1="410" y1="80" x2="1220" y2="80"/>
<text class="v" x="420" y="70" fill="#d1493f">+BATT (3,0–4,2 V)</text>
<line class="gn bus" x1="320" y1="640" x2="1220" y2="640"/>
<text class="v" x="330" y="662">GND</text>

<!-- BATTERIA -->
<rect x="20" y="120" width="90" height="140" rx="6" fill="#fef4e0" stroke="#c98a1e"/>
<text class="h" x="65" y="172" text-anchor="middle">LiPo 1S</text>
<text class="s" x="65" y="190" text-anchor="middle">3,7 V</text>
<text class="s" x="65" y="206" text-anchor="middle">3000 mAh</text>
<text class="s" x="65" y="222" text-anchor="middle">con BMS</text>
<text class="v" x="100" y="146" text-anchor="end">+</text>
<text class="v" x="100" y="240" text-anchor="end">−</text>
<line class="pw" x1="110" y1="150" x2="150" y2="150"/>
<line class="gn" x1="110" y1="230" x2="150" y2="230"/>

<!-- TP4056 -->
<rect x="150" y="110" width="150" height="160" rx="6" fill="#e8f0fe" stroke="#3b6fd1"/>
<text class="h" x="225" y="182" text-anchor="middle">TP4056</text>
<text class="s" x="225" y="198" text-anchor="middle">con protezione</text>
<text class="p" x="158" y="154">B+</text>
<text class="p" x="158" y="234">B−</text>
<text class="p" x="292" y="154" text-anchor="end">OUT+</text>
<text class="p" x="292" y="234" text-anchor="end">OUT−</text>
<rect x="195" y="270" width="60" height="22" rx="4" fill="#e5e7eb" stroke="#888"/>
<text class="p" x="225" y="285" text-anchor="middle">USB‑C</text>
<text class="s" x="225" y="310" text-anchor="middle">ricarica</text>

<!-- J1 -->
<line class="pw" x1="300" y1="150" x2="330" y2="150"/>
<rect x="330" y="138" width="50" height="24" rx="4" fill="#ffffff" stroke="#888"/>
<circle cx="343" cy="150" r="3" fill="#2b333b"/>
<circle cx="367" cy="150" r="3" fill="#2b333b"/>
<rect x="337" y="143" width="36" height="14" rx="3" fill="none" stroke="#d1493f" stroke-dasharray="3 2"/>
<text class="h" x="355" y="130" text-anchor="middle">J1</text>
<text class="s" x="325" y="184">jumper on/off</text>
<text class="s" x="325" y="198">+ misura corrente</text>
<polyline class="pw" points="380,150 410,150 410,80"/>
<polyline class="gn" points="300,230 320,230 320,640"/>

<!-- TCRT5000 -->
<text class="h" x="425" y="312" text-anchor="middle">TCRT5000</text>
<rect x="360" y="320" width="130" height="210" rx="6" fill="#e6f4f1" stroke="#2c8a7a"/>
<circle cx="392" cy="380" r="15" fill="#3b6fd1"/>
<text class="s" x="392" y="408" text-anchor="middle">lente blu</text>
<text class="s" x="392" y="421" text-anchor="middle">LED IR</text>
<circle cx="392" cy="462" r="15" fill="#222222"/>
<text class="s" x="392" y="490" text-anchor="middle">lente nera</text>
<text class="s" x="392" y="503" text-anchor="middle">foto‑T</text>
<text class="p" x="482" y="344" text-anchor="end">PT‑C</text>
<text class="p" x="482" y="384" text-anchor="end">LED‑A</text>
<text class="p" x="482" y="444" text-anchor="end">PT‑E</text>
<text class="p" x="482" y="504" text-anchor="end">LED‑K</text>

<!-- PT-C -> +BATT -->
<polyline class="pw" points="490,340 530,340 530,80"/>
<!-- LED-A -> R1 -> pin 7 -->
<line class="sg" x1="490" y1="380" x2="515" y2="380"/>
<path class="sg" d="M515,380 l5,-8 l10,16 l10,-16 l10,16 l10,-16 l5,8"/>
<polyline class="sg" points="565,380 580,380 580,300 600,300"/>
<text class="v" x="540" y="364" text-anchor="middle">R1 220 Ω</text>
<text class="s" x="540" y="404" text-anchor="middle">rosso‑rosso‑marrone</text>
<!-- PT-E -> A0, R2 -> GND -->
<line class="sg" x1="490" y1="440" x2="600" y2="440"/>
<circle cx="545" cy="440" r="3.5" fill="#6b7580"/>
<line class="sg" x1="545" y1="440" x2="545" y2="470"/>
<path class="sg" d="M545,470 l8,5 l-16,10 l16,10 l-16,10 l16,10 l-16,10 l8,5"/>
<line class="gn" x1="545" y1="530" x2="545" y2="640"/>
<text class="v" x="557" y="498">R2 10 kΩ</text>
<text class="s" x="557" y="513">marrone‑nero‑arancio</text>
<!-- LED-K -> GND -->
<polyline class="gn" points="490,500 510,500 510,640"/>

<!-- PRO MINI -->
<rect x="600" y="260" width="190" height="230" rx="6" fill="#efeafd" stroke="#6b4fce"/>
<text class="h" x="695" y="345" text-anchor="middle">Pro Mini 3,3 V / 8 MHz</text>
<text class="s" x="695" y="362" text-anchor="middle">regolatore e LED rimossi</text>
<text class="p" x="608" y="304">7</text>
<text class="p" x="608" y="444">A0</text>
<text class="p" x="660" y="278" text-anchor="middle">VCC</text>
<text class="p" x="660" y="482" text-anchor="middle">GND</text>
<text class="p" x="782" y="304" text-anchor="end">4</text>
<text class="p" x="782" y="394" text-anchor="end">GND</text>
<text class="p" x="782" y="419" text-anchor="end">VCC</text>
<text class="p" x="782" y="444" text-anchor="end">RXI</text>
<text class="p" x="782" y="469" text-anchor="end">TXO</text>
<line class="pw" x1="660" y1="260" x2="660" y2="80"/>
<line class="gn" x1="660" y1="490" x2="660" y2="640"/>

<!-- J2 programmazione -->
<text class="h" x="895" y="365" text-anchor="middle">J2 → CP2102</text>
<rect x="830" y="375" width="130" height="105" rx="6" fill="#f3f4f6" stroke="#888"/>
<line class="sg" x1="790" y1="390" x2="830" y2="390"/>
<line class="sg" x1="790" y1="415" x2="830" y2="415"/>
<line class="sg" x1="790" y1="440" x2="830" y2="440"/>
<line class="sg" x1="790" y1="465" x2="830" y2="465"/>
<text class="p" x="842" y="394">GND</text>
<text class="p" x="842" y="419">3V3</text>
<text class="p" x="842" y="444">TXD</text>
<text class="p" x="842" y="469">RXD</text>
<text class="s" x="895" y="500" text-anchor="middle">solo per il firmware:</text>
<text class="s" x="895" y="514" text-anchor="middle">togli J1 prima</text>

<!-- STX882 -->
<rect x="880" y="160" width="120" height="150" rx="6" fill="#fdecea" stroke="#d1493f"/>
<text class="h" x="940" y="232" text-anchor="middle">STX882</text>
<text class="s" x="940" y="250" text-anchor="middle">433,92 MHz</text>
<text class="p" x="888" y="194">VCC</text>
<text class="p" x="888" y="304">DATA</text>
<text class="p" x="992" y="294" text-anchor="end">GND</text>
<line class="sg" x1="940" y1="160" x2="940" y2="106"/>
<polyline class="sg" points="928,96 940,106 952,96"/>
<text class="s" x="952" y="134">antenna λ/4 (~17 cm)</text>
<polyline class="pw" points="880,190 860,190 860,80"/>
<line class="sg" x1="790" y1="300" x2="880" y2="300"/>
<polyline class="gn" points="1000,290 1030,290 1030,640"/>

<!-- C1 100uF -->
<line class="pw" x1="1080" y1="80" x2="1080" y2="345"/>
<line x1="1064" y1="345" x2="1096" y2="345" stroke="#2b333b" stroke-width="2.5"/>
<path d="M1064,360 Q1080,352 1096,360" fill="none" stroke="#2b333b" stroke-width="2.5"/>
<text class="v" x="1100" y="341">+</text>
<line class="gn" x1="1080" y1="356" x2="1080" y2="640"/>
<text class="v" x="1104" y="384">C1 100 µF</text>
<text class="s" x="1104" y="398">elettrolitico</text>
<text class="s" x="1104" y="411">− verso GND</text>

<!-- C2 100nF -->
<line class="pw" x1="1170" y1="80" x2="1170" y2="345"/>
<line x1="1154" y1="345" x2="1186" y2="345" stroke="#2b333b" stroke-width="2.5"/>
<line x1="1154" y1="357" x2="1186" y2="357" stroke="#2b333b" stroke-width="2.5"/>
<line class="gn" x1="1170" y1="357" x2="1170" y2="640"/>
<text class="v" x="1176" y="470">C2</text>
<text class="s" x="1176" y="484">100 nF</text>
<text class="s" x="1176" y="497">"104"</text>

<!-- giunzioni -->
<g fill="#d1493f">
 <circle cx="410" cy="80" r="4"/><circle cx="530" cy="80" r="4"/><circle cx="660" cy="80" r="4"/>
 <circle cx="860" cy="80" r="4"/><circle cx="1080" cy="80" r="4"/><circle cx="1170" cy="80" r="4"/>
</g>
<g fill="#2b333b">
 <circle cx="320" cy="640" r="4"/><circle cx="510" cy="640" r="4"/><circle cx="545" cy="640" r="4"/>
 <circle cx="660" cy="640" r="4"/><circle cx="1030" cy="640" r="4"/><circle cx="1080" cy="640" r="4"/><circle cx="1170" cy="640" r="4"/>
</g>
<text class="s" x="1125" y="662" text-anchor="middle">C1 e C2 il più vicino possibile allo STX882</text>

<!-- note -->
<text class="s" x="20" y="700">• Il "−" della batteria va SOLO su B− del TP4056: non collegarlo a GND (la protezione sta tra B− e OUT−).</text>
<text class="s" x="20" y="716">• L'ordine dei pin del TCRT5000 è disegnato per chiarezza, non è quello fisico: usa le marcature fatte sul componente.</text>
<text class="s" x="20" y="732">• A1 resta libero per il futuro partitore di lettura batteria.</text>
</svg>
