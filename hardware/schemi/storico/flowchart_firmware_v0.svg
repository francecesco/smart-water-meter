 .flow{stroke:#5b6570;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
 .dot{fill:#5b6570;}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
