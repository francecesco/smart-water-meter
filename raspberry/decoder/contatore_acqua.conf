# BOZZA — decoder flex per il frame a 64 bit (docs/protocollo-radio.md)
# Tempi da confermare con:  timeout 60 rtl_433 -A -f 433.92M
# Se il decoder validato in garage è diverso, vale quello: aggiornare questo file.
#
# s/l   = impulso corto/lungo (500/1500 us)
# g     = gap massimo dentro una riga (> 500 us di pausa tra bit, < 10 ms tra ripetizioni)
# r     = reset: fine pacchetto (> 10 ms tra ripetizioni)
# invert: in OOK_PWM rtl_433 legge il corto come 1; il nostro corto è 0
# bits/repeats: scarta il rumore (falsi eventi da 1-3 bit)
#
# Uso: rtl_433 -c contatore_acqua.conf   oppure come singolo -X '...'
decoder n=ContatoreAcqua,m=OOK_PWM,s=500,l=1500,g=4000,r=20000,invert,bits=64,repeats>=2,match={16}aa5a
