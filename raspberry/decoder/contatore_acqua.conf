# Decoder flex per il frame a 64 bit (docs/protocollo-radio.md)
# Validato in garage il 28/10/2026 ed è quello installato in rtl433.service.
#
# s/l      = impulso corto/lungo (500/1500 us)
# g        = gap massimo dentro una riga (pausa di 500 us tra i bit)
# r=15000  = reset oltre i 10 ms tra le ripetizioni: le 3 ripetizioni finiscono
#            nello stesso pacchetto, altrimenti repeats>=2 non scatta
# invert   = in OOK_PWM rtl_433 legge il corto come 1; il nostro corto è 0
#            (senza invert il grezzo è 55a5..., invertito AA 5A ...)
# bits/repeats/match = scartano il rumore (falsi eventi da 1-3 bit)
# unique   = un solo evento per pacchetto
# get=...  = campi pubblicati su MQTT. Si chiama "impulsi" e non "count"
#            perché "count" collide con un campo interno di rtl_433.
#
# Il flex decoder non sa verificare un checksum a somma: lo controlla Home Assistant.
#
# Uso: rtl_433 -c contatore_acqua.conf   oppure come singolo -X '...'
decoder n=ContatoreAcquaV2,m=OOK_PWM,s=500,l=1500,r=15000,g=1200,bits=64,invert,match={16}aa5a,repeats>=2,unique,get=@16:{32}:impulsi,get=@48:{8}:batteria_raw,get=@56:{8}:checksum
